---
# role: cockpit
# file: defaults/main.yml

# Packages installed for the web service and selected Cockpit applications.
cockpit_packages:
  - cockpit-ws
  - cockpit-system
# cockpit_packages: [cockpit-ws, cockpit-system, cockpit-storaged]

# Installation policy for the selected packages, including Debian backports upgrades.
# Choices: present, latest
cockpit_package_state: latest

# Debian mirror providing the distribution's backports suite.
cockpit_debian_backports_uri: https://deb.debian.org/debian

# Cockpit configuration for local HTTPS access and a fifteen-minute password idle timeout.
cockpit_config:
  WebService:
    LoginTo: false
    AllowMultiHost: false
    AllowUnencrypted: false
    MaxStartups: 10
  Session:
    IdleTimeout: 15
    WarnBeforeConnecting: true
# cockpit_config: {}
