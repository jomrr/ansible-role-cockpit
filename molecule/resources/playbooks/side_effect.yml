---
# role: cockpit
# file: molecule/resources/playbooks/side_effect.yml

- name: COCKPIT | Exercise application selection, configuration updates and service recovery
  hosts: all
  gather_facts: false
  tasks:
    - name: COCKPIT | Clear cached facts before applying the role
      ansible.builtin.meta: clear_facts

    - name: COCKPIT | Add an application and customize the login page
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        cockpit_packages: [cockpit-ws, cockpit-system, cockpit-storaged]
        cockpit_config:
          WebService:
            LoginTitle: Molecule Cockpit
            LoginTo: false
            AllowMultiHost: false
            AllowUnencrypted: false
            MaxStartups: 10
          Session:
            IdleTimeout: 5
            WarnBeforeConnecting: true

    - name: COCKPIT | Query the updated login page
      ansible.builtin.uri:
        url: https://localhost:9090/
        validate_certs: false
        return_content: true
      register: __cockpit_updated_login
      until: __cockpit_updated_login.status == 200
      retries: 10
      delay: 2

    - name: COCKPIT | Verify the running service uses the new configuration
      ansible.builtin.assert:
        that: "'Molecule Cockpit' in __cockpit_updated_login.content"
        quiet: true

    - name: COCKPIT | Query selected applications
      ansible.builtin.package_facts:
        manager: auto

    - name: COCKPIT | Verify the additional application is installed
      ansible.builtin.assert:
        that: "'cockpit-storaged' in ansible_facts.packages"
        quiet: true

    - name: COCKPIT | Exercise invalid configuration options
      block:
        - name: COCKPIT | Apply multiline and nested option values
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            cockpit_config:
              WebService:
                LoginTitle: |-
                  Molecule
                  Cockpit
                Origins: [https://example.org]

        - name: COCKPIT | Fail if invalid options were accepted
          ansible.builtin.fail:
            msg: Cockpit accepted invalid configuration.

      rescue:
        - name: COCKPIT | Verify rejection of both invalid options
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results | map(attribute='msg') | sort ==
                ['Invalid cockpit.conf option name or value for LoginTitle.',
                 'Invalid cockpit.conf option name or value for Origins.']
            quiet: true

    - name: COCKPIT | Stop the web service
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: cockpit.service
        state: stopped

    - name: COCKPIT | Stop and disable socket activation
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: cockpit.socket
        enabled: false
        state: stopped
